releaseNotes: >-
  This update includes several bug fixes and improvements:
  - Verbesserte Bridge-Funktionalität und optimierte Behandlung von Leerlauf-Timeouts
  - Behobene Probleme mit der Nachrichtenwarteschlange und Client-Verbindungsabbrüchen
  - Kompilierungs- und Linkprobleme auf verschiedenen Plattformen behoben
  - Verbesserte WebSocket-Unterstützung, einschließlich sicherer WebSockets
  - Verbesserte Speicherverwaltung und Fehlerbehandlung


  Die vollständigen Versionshinweise finden Sie unter https://mosquitto.org/blog/
