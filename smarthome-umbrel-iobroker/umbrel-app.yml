   Wichtiger Hinweis
Neue Hauptversionen des Images (z. B. v6, v7, v8) enthalten in der Regel eine neue Hauptversion von Node! Obwohl js-controller diese Art von Aktualisierung problemlos handhaben sollte, führt dies in einigen Fällen dennoch zu Problemen mit einigen Adaptern. Um Probleme mit diesen Hauptversionsaktualisierungen zu vermeiden, ist es immer ratsam, Ihren Container manuell mit einem Backup- und Wiederherstellungsverfahren zu aktualisieren. Weitere Informationen finden Sie im Wartungsabschnitt der ioBroker Docker Image -
