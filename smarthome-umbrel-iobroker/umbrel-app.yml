tagline: Home Automation
description: >-
IoBroker is an open source IoT platform written in JavaScript that easily connects smarthome components from different manufactures. With the help of plugins (called ) ioBroker is able to communicate with a big variety of IoT hardware and services using different protocols and APIs. All data is stored in a central database that all adapters can access. With this it is very easy to build up logical connections, automation scripts and beautiful visualizations.For further details please check out iobroker.net.
