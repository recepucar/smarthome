releaseNotes: >-
  This hotfix release resolves an issue causing excessive disk writes that could crash Zigbee2MQTT.


  Key improvements and fixes:
    - Problem mit übermäßigen Festplattenschreibvorgängen behoben
    - Erweiterte Geräteunterstützung für Aqara W600, Tuya PJ1203A und verschiedene andere Geräte
    - Verbesserte Home Assistant-Integration für Klimageräte
    - Behobene OTA-Updates für verschiedene Ledvance-Stecker
    - Korrelierter Farbtemperaturbereich für Philips-Lampen
    - Diverse Fehlerbehebungen und Stabilitätsverbesserungen
    - Unterstützung für 20 neue Geräte


  Die vollständigen Versionshinweise finden Sie unter https://github.com/Koenkk/zigbee2mqtt/releases
dependencies:
  - mosquitto
path: ""
